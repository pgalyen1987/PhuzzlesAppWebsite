<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- A puzzle's address is the only key to a puzzle shared as a link, so a page opened from here is told the
     origin, never the address. -->
<meta name="referrer" content="strict-origin" />
<title>You've got a Phuzzle</title>
<meta name="description" content="Someone sent you a photo puzzle. Solve it to reveal the picture and their hidden message." />
<meta name="robots" content="noindex" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://phuzzles.app/puzzle/" />
<meta property="og:title" content="You've got a Phuzzle" />
<meta property="og:description" content="Solve the puzzle to reveal the photo and a hidden message. No app needed." />
<meta property="og:image" content="https://phuzzles.app/img/og-solve.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#1A1A2E" />
<link rel="icon" href="/logo-128.png" />
<style>
  @font-face{font-family:'Archivo';src:url('/fonts/archivo-var-latin.woff2') format('woff2');font-weight:700 900;font-stretch:62% 125%;font-display:swap}
  @font-face{font-family:'DM Sans';src:url('/fonts/dm-sans-var-latin.woff2') format('woff2');font-weight:400 600;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#1A1A2E;--border:rgba(245,243,239,.12);--text:#F5F3EF;--muted:#A9A9C6;--accent:#FF6B6B}
  body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;min-height:100dvh;display:flex;padding:20px;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:420px;margin:auto;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;margin-bottom:26px}
  .brand img{width:32px;height:32px;border-radius:8px}
  .brand span{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:112%;font-size:1.17rem;line-height:1}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:108%;font-size:1.618rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px}
  h1 em{color:var(--accent);font-style:normal}
  p{color:var(--muted);font-size:15px;line-height:1.5}
  .btn{display:block;background:var(--accent);color:var(--bg);font-weight:700;border-radius:12px;padding:14px 22px;
       font-size:15px;text-decoration:none;margin-top:22px}
  .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;
        animation:s 1s linear infinite;margin:22px auto 0}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/logo-128.png" alt="" /><span>Phuzzles</span></a>
  <div id="opening">
    <h1>You've got a <em>Phuzzle</em></h1>
    <p>Opening it now.</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
  <div id="noid" class="hidden">
    <h1>This link is missing its puzzle</h1>
    <p>Whoever sent it may have cut the address short. Ask them to send it again.</p>
    <a class="btn" href="/">What is Phuzzles?</a>
  </div>
</main>
<script>
// GitHub Pages serves a file that exists with a 200 and everything else with its 404 page, so /puzzle/<id>
// (the path an app shares today) can never carry a link preview: no chat builds a card for a 404. /puzzle/?id=<id>
// is this file, which does return 200, so the tags above are what a recipient sees in the chat before they tap.
// It is the /puzzle/ twin of the already-live /solve/?p=<id>; use whichever path a future share link adopts.
// The board itself stays in one place — 404.html, where the solves we have measured came from.
//
// It hands off to /solve/<id>, NOT /puzzle/<id>, on purpose: both apps CLAIM /puzzle/ deep links, so a
// recipient who has the app installed would have the OS intercept /puzzle/<id> and open the app (which, on
// Android through 1.3.1, then drops the puzzle and shows its home feed). /solve/ is never claimed, so it
// always opens the board here in the browser. That is the whole reason /solve/ exists.
(function(){
  var id = null;
  // ?id= is what this route is named for; ?p= is the convention /solve/ and the analytics scrubber already use,
  // so accept either and never strand a link that used the other.
  try { var qs = new URLSearchParams(location.search); id = qs.get("id") || qs.get("p"); } catch (e) {}
  // Firestore has no document named "." or "..", and either would be read as a step back up the path.
  if (!id || id === "." || id === "..") { document.getElementById("opening").className = "hidden";
             document.getElementById("noid").className = ""; return; }
  // The campaign tags go along so analytics still credits whoever sent the visit; id/p do not, because the
  // id is in the path from here on.
  var q = "";
  try { var u = new URLSearchParams(location.search); u.delete("id"); u.delete("p"); q = u.toString(); } catch (e) {}
  // The campaign tags above cover a link we tagged ourselves. A link someone pasted into a chat, or a
  // search result, carries only a referrer -- and this forward destroys it: the board arrives with
  // phuzzles.app as its referrer, GA4 ignores a self-referral, and the visit is filed as (direct)/(none).
  // This line is the last moment the real referrer exists, so hand it on. sessionStorage, not a query
  // param, because a param would end up in page_location; 404.html reads it once and clears it.
  try { var fwdRef = document.referrer;
        if (fwdRef && new URL(fwdRef).origin !== location.origin) sessionStorage.setItem("phz_ref", fwdRef); }
  catch (e) {}
  location.replace("/solve/" + encodeURIComponent(id) + (q ? "?" + q : ""));
})();
</script>
</body>
</html>
