<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Phuzzles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container { padding: 2rem; max-width: 400px; }
        .logo { font-size: 72px; margin-bottom: 1rem; }
        h2 { margin: 0.5rem 0; }
        p { opacity: 0.9; line-height: 1.5; }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: white;
            color: #764ba2;
            border-radius: 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .secondary-link {
            display: block;
            margin-top: 1rem;
            color: rgba(255,255,255,0.8);
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
    <script>
        (function() {
            var path = window.location.pathname;
            var playStoreBase = 'https://play.google.com/store/apps/details?id=rebelstudios.phuzzles.app';

            // Check if this is a puzzle deep link
            var puzzleMatch = path.match(/^\/puzzle\/([a-zA-Z0-9_-]+)/);

            if (puzzleMatch) {
                var puzzleId = puzzleMatch[1];
                var androidIntent = 'intent://puzzle/' + puzzleId
                    + '#Intent;scheme=phuzzles;package=rebelstudios.phuzzles.app;'
                    + 'S.puzzleId=' + puzzleId + ';end';
                var playStoreUrl = playStoreBase + '&referrer=puzzle_' + puzzleId;

                // On Android, try to open the app
                if (/Android/i.test(navigator.userAgent)) {
                    window.location = androidIntent;
                    setTimeout(function() {
                        window.location = playStoreUrl;
                    }, 1500);
                }
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">🧩</div>
        <script>
            var puzzleMatch = window.location.pathname.match(/^\/puzzle\/([a-zA-Z0-9_-]+)/);
            if (puzzleMatch) {
                document.write('<h2>Someone sent you a Phuzzle!</h2>');
                document.write('<p>Download Phuzzles to unscramble the photo puzzle and see the hidden image.</p>');
            } else {
                document.write('<h2>Phuzzles</h2>');
                document.write('<p>Turn your photos into puzzles and send them to friends!</p>');
            }
        </script>
        <a class="btn" href="https://play.google.com/store/apps/details?id=rebelstudios.phuzzles.app">
            Get Phuzzles on Google Play
        </a>
        <a class="secondary-link" href="/">Back to phuzzles.app</a>
    </div>
</body>
</html>
