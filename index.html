<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Phuzzles — Photo Puzzles with Friends</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turn your photos into scrambled puzzles and send them to friends. Download Phuzzles on Google Play.">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container { padding: 2rem; max-width: 500px; }
        .logo { font-size: 72px; margin-bottom: 1rem; }
        h1 { margin: 0.5rem 0; font-size: 2.5rem; }
        .tagline { font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem; }
        .features { text-align: left; margin: 2rem 0; line-height: 2; }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: white;
            color: #764ba2;
            border-radius: 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .links { margin-top: 2rem; }
        .links a { color: rgba(255,255,255,0.7); margin: 0 1rem; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧩</div>
        <h1>Phuzzles</h1>
        <p class="tagline">Turn your photos into puzzles and send them to friends!</p>
        <div class="features">
            📸 Pick any photo<br>
            🔀 It gets scrambled into a puzzle<br>
            📨 Send it to a friend<br>
            🧩 They solve it to reveal the image<br>
        </div>
        <a class="btn" href="https://play.google.com/store/apps/details?id=rebelstudios.phuzzles.app">
            Download on Google Play
        </a>
        <div class="links">
            <a href="/privacy.html">Privacy Policy</a>
            <a href="/terms.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
