<style>
  @font-face{font-family:'Archivo';src:url('/fonts/archivo-var-latin.woff2') format('woff2');font-weight:700 900;font-stretch:62% 125%;font-display:swap}
  @font-face{font-family:'DM Sans';src:url('/fonts/dm-sans-var-latin.woff2') format('woff2');font-weight:400 600;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#1A1A2E;--border:rgba(245,243,239,.12);--text:#F5F3EF;--muted:#A9A9C6;--accent:#FF6B6B}
  body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;min-height:100dvh;display:flex;padding:20px;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:420px;margin:auto;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;margin-bottom:26px}
  .brand img{width:32px;height:32px;border-radius:8px}
  .brand span{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:112%;font-size:1.17rem;line-height:1}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:108%;font-size:1.618rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px}
  p{color:var(--muted);font-size:15px;line-height:1.5}
  .btn{display:block;background:var(--accent);color:var(--bg);font-weight:700;border-radius:12px;padding:14px 22px;
       font-size:15px;text-decoration:none;margin-top:22px}
  .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;
        animation:s 1s linear infinite;margin:22px auto 0}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/logo-128.png" alt="" /><span>Phuzzles</span></a>
  <div id="finding">
    <h1 id="t-h1">Today’s photo puzzle</h1>
    <p id="t-finding">Finding today's puzzle.</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
  <div id="none" class="hidden">
    <h1 id="t-nonetitle">Today's puzzle isn't up yet</h1>
    <p id="why">A new one goes up every day at 11:00 Eastern. The puzzle on our homepage is always there in the meantime.</p>
    <a class="btn" id="t-nonebtn" href="/">Solve the homepage puzzle</a>
  </div>
</main>
<script>
// i18n. /today/ is the permanent link on the posters, the QR codes and a bio, so for plenty of
// people it is the first Phuzzles page they ever see, and on a day with no daily puzzle it is the
// only one. Same fall-through as /solve/ and /daily/: the browser's language, with the
// server-rendered English left in place as the fallback, so a missing key cannot drift. The
// <head>/og tags stay English for the reason /solve/ gives: a static host cannot know the reader's
// language before a link preview is built. The four network-error strings and "Try again" are
// copied verbatim from the solver (404.html), and each "11:00 Eastern" is the wording /daily/
// already uses, so the surfaces cannot say it two ways.
var PhuzzlesT = (function(){
  var l = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  var LANG =
    (l === "ja" || l.indexOf("ja-") === 0) ? "ja" :
    (l === "fr" || l.indexOf("fr-") === 0) ? "fr" :
    (l === "es" || l.indexOf("es-") === 0) ? "es" :
    (l === "de" || l.indexOf("de-") === 0) ? "de" :
    (l === "pt" || l.indexOf("pt-") === 0) ? "pt" : "en";
  var STR = {
    ja: {
      h1: "今日の写真パズル",
      finding: "今日のパズルを探しています。",
      noneTitle: "今日のパズルはまだ出ていません",
      noneWhy: "新作は毎日アメリカ東部時間11:00に出ます。それまでは、トップページのパズルがいつでも解けます。",
      noneBtn: "トップページのパズルを解く",
      busyTitle: "このネットワークからの初回アクセスが多すぎます",
      busySub: "1つのネットワークから同時に入れる人数には限りがあります。数分後にもう一度お試しください。",
      offlineTitle: "Phuzzlesに接続できませんでした",
      offlineSub: "パズルを読み込めませんでした。接続を確認して、もう一度お試しください。",
      tryAgain: "もう一度試す"
    },
    fr: {
      h1: "Le puzzle photo du jour",
      finding: "Recherche du puzzle du jour.",
      noneTitle: "Le puzzle du jour n'est pas encore en ligne",
      noneWhy: "Un nouveau arrive chaque jour à 11h00 (heure de l'Est des États-Unis). En attendant, celui de la page d'accueil est toujours là.",
      noneBtn: "Résoudre le puzzle de la page d'accueil",
      busyTitle: "Trop de premières visites depuis ce réseau",
      busySub: "Phuzzles ne peut accueillir qu'un nombre limité de personnes à la fois depuis un même réseau. Réessayez dans quelques minutes.",
      offlineTitle: "Impossible de joindre Phuzzles",
      offlineSub: "Le puzzle ne s'est pas chargé. Vérifiez votre connexion et réessayez.",
      tryAgain: "Réessayer"
    },
    es: {
      h1: "El puzzle de fotos de hoy",
      finding: "Buscando el puzzle de hoy.",
      noneTitle: "El puzzle de hoy aún no está",
      noneWhy: "Uno nuevo llega cada día a las 11:00 (hora del Este de EE. UU.). Mientras tanto, el de la página de inicio siempre está ahí.",
      noneBtn: "Resolver el puzzle de la página de inicio",
      busyTitle: "Demasiadas primeras visitas desde esta red",
      busySub: "Phuzzles solo admite un número limitado de personas a la vez desde una misma red. Inténtalo de nuevo en unos minutos.",
      offlineTitle: "No se pudo conectar con Phuzzles",
      offlineSub: "El rompecabezas no se cargó. Revisa tu conexión e inténtalo de nuevo.",
      tryAgain: "Reintentar"
    },
    de: {
      h1: "Das Fotopuzzle des Tages",
      finding: "Das heutige Puzzle wird gesucht.",
      noneTitle: "Das heutige Puzzle ist noch nicht da",
      noneWhy: "Jeden Tag um 11:00 Uhr (US-Ostküstenzeit) kommt ein neues dazu. Bis dahin ist das Puzzle auf der Startseite immer da.",
      noneBtn: "Das Puzzle auf der Startseite lösen",
      busyTitle: "Zu viele Erstbesuche aus diesem Netzwerk",
      busySub: "Aus einem Netzwerk können nur begrenzt viele Personen gleichzeitig teilnehmen. Versuch es in ein paar Minuten noch einmal.",
      offlineTitle: "Phuzzles ist nicht erreichbar",
      offlineSub: "Das Puzzle wurde nicht geladen. Prüf deine Verbindung und versuch es noch einmal.",
      tryAgain: "Erneut versuchen"
    },
    pt: {
      h1: "O quebra-cabeça de fotos de hoje",
      finding: "Procurando o quebra-cabeça de hoje.",
      noneTitle: "O quebra-cabeça de hoje ainda não está no ar",
      noneWhy: "Um novo chega todo dia às 11:00 (horário do leste dos EUA). Até lá, o da página inicial está sempre lá.",
      noneBtn: "Resolver o quebra-cabeça da página inicial",
      busyTitle: "Muitas primeiras visitas desta rede",
      busySub: "De uma mesma rede, só um número limitado de pessoas pode entrar ao mesmo tempo. Tente de novo em alguns minutos.",
      offlineTitle: "Não foi possível conectar ao Phuzzles",
      offlineSub: "O quebra-cabeça não carregou. Verifique a sua conexão e tente de novo.",
      tryAgain: "Tentar de novo"
    }
  };
  var d = STR[LANG];
  function T(k, fallback){ return (d && d[k]) || fallback; }
  if (!d) return T;
  document.documentElement.lang = LANG;
  function txt(id, v){ var el = document.getElementById(id); if (el && v) el.textContent = v; }
  txt("t-h1", d.h1);
  txt("t-finding", d.finding);
  txt("t-nonetitle", d.noneTitle);
  txt("why", d.noneWhy);
  txt("t-nonebtn", d.noneBtn);
  return T;
})();
</script>
<script src="/js/firestore-rest.js"></script>
<script>
// One link that always opens the current Puzzle of the Day (createPuzzleOfTheDay sets isPotd on one
// puzzle at 11:00 Eastern and clears the day before's), for bios, posters and posts that outlive a day.
// It forwards to /solve/<id>, not /puzzle/<id>: the apps claim /puzzle/ links, and /solve/ always opens
// the browser solver. The query string goes along, so analytics still credits whoever sent the visit.
(function(){
  // No daily yet: say so and offer the homepage puzzle. Couldn't look (title and msg given): the daily may well be up,
  // so the heading must not say it isn't, and the button retries.
  function none(title, msg){
    document.getElementById("finding").classList.add("hidden");
    var btn = document.querySelector("#none .btn");
    if (title) {
      document.querySelector("#none h1").textContent = title;
      document.getElementById("why").textContent = msg;
      btn.textContent = PhuzzlesT("tryAgain", "Try again"); btn.href = location.href;
    } else btn.href = "/" + location.search;
    document.getElementById("none").classList.remove("hidden");
  }
  // The rules let a signed-in visitor (anonymous is enough) list isPotd puzzles. This page and the solver it
  // forwards to used to load 150 kB of Firebase SDK each and sign in twice over; both now make the two calls
  // themselves (js/firestore-rest.js) and share the one anonymous identity.
  PhuzzlesDB.query({
      from: [{ collectionId: "puzzles" }],
      where: { fieldFilter: { field: { fieldPath: "isPotd" }, op: "EQUAL", value: { booleanValue: true } } }
    })
    .then(function(rows){
      var ms = function(v){ return v && v.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0); };
      var docs = rows.slice().sort(function(a, b){ return ms(b.data.sentAt) - ms(a.data.sentAt); });
      if (!docs.length) { none(); return; }
      location.replace("/solve/" + encodeURIComponent(docs[0].id) + location.search);
    })
    // Firebase stops signing in new visitors from one address after a burst of them (auth/too-many-requests; a day
    // of test runs tripped it on 2026-10-05 for a few minutes). An office, a campus or a phone carrier puts many
    // people behind one address, so it isn't their connection. The same words as the 404 solver and the mini app.
    .catch(function(e){
      if (e && e.code === "auth/too-many-requests")
        none(PhuzzlesT("busyTitle", "Too many first visits from this network"),
             PhuzzlesT("busySub", "Phuzzles can only let in so many at once from one network. Try again in a few minutes."));
      else
        none(PhuzzlesT("offlineTitle", "Couldn’t reach Phuzzles"),
             PhuzzlesT("offlineSub", "Today’s puzzle didn’t load. Check your connection and try again."));
    });
})();
</script>
</body>
</html>
