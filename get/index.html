<body>
<main>
  <img class="logo" src="/logo-128.png" alt="" width="76" height="76" />
  <h1>Phuzzles</h1>
  <p>Send a photo puzzle with a message hidden inside. Your friend only sees it once they solve it.</p>

  <div class="row" id="android">
    <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=rebelstudios.phuzzles.app">Get it on Google Play</a>
  </div>

  <!-- Only shown if IOS_URL below is ever emptied again: an iPhone visitor then gets the browser puzzle
       rather than a dead end. Phuzzles has been on the App Store since 2026-09-30. -->
  <div class="row hidden" id="ios">
    <a class="btn" href="/p/poster">Solve one in your browser</a>
    <a class="btn alt" href="https://apps.apple.com/app/id6766833614">Get it on the App Store</a>
  </div>

</main>
<script>
  // iPhones go straight to the App Store listing (live since 2026-09-30).
  var IOS_URL = "https://apps.apple.com/app/id6766833614";
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var show = function (id) { document.getElementById(id).classList.remove("hidden"); };
  var hide = function (id) { document.getElementById(id).classList.add("hidden"); };
  // DON'T GUESS THE BEAT -- WAIT FOR THE HIT. The old blind 250ms was a race with no margin.
  // Measured 2026-11-26 on this page's own snippet, cold cache -- which is EVERY first visit,
  // because Chrome partitions the HTTP cache per top-level site, so gtag.js is never already
  // there: gtag.js finishes loading at 165-227ms and the pageview only reaches the wire at
  // 245-301ms (4 samples, wired desktop), i.e. at or after the instant the old code replaced
  // the document. Warm cache was 188ms, inside. Delivery did NOT visibly fail here -- 6 of 6
  // loads of the old page still reached GA4, because once gtag.js is loaded its unload beacon
  // rescues the hit -- so this is a race removed, not a loss recovered. It is worth removing
  // because every real visitor arrives on a slower mobile path than the one measured, and this
  // page is where every video link, every poster QR and every store install begins.
  // So: hand off when GA4 acknowledges a hit (normally ~300ms), and cap the wait so nobody is
  // ever trapped here if gtag.js is blocked or absent. The `handoff` event also records WHERE
  // they went -- play, appstore or site -- which nothing else on the site can tell us.
  var gone = false;
  var go = function (url) { if (!gone) { gone = true; location.replace(url); } };
  var leave = function (url, to) {
    gtag("event", "handoff", { to: to, event_callback: function () { go(url); }, event_timeout: 1000 });
    setTimeout(function () { go(url); }, 1000);
  };
  // The post's utm tags ride along to Play as the install referrer, as the homepage's badge does.
  var q = new URLSearchParams(location.search), utm = [];
  ["utm_source", "utm_medium", "utm_campaign", "utm_content"].forEach(function (k) { if (q.get(k)) utm.push(k + "=" + q.get(k)); });
  var PLAY = "https://play.google.com/store/apps/details?id=rebelstudios.phuzzles.app" +
    (utm.length ? "&referrer=" + encodeURIComponent(utm.join("&")) : "");
  document.getElementById("play").href = PLAY;
  // APPLE NEEDS ITS OWN TOKEN. The Play referrer above carries the utm tags, but App Store Connect
  // reads NONE of that -- it attributes on `ct` (campaign token) only, so every iOS install from a
  // tagged link was landing in App Analytics as unattributed. Prefer utm_content (the per-clip
  // field, e.g. "puppy") and fall back to the campaign, then the source, so a link that tags
  // anything at all is attributable. `ct` is capped at 40 chars by Apple and must not be empty.
  var ct = (q.get("utm_content") || q.get("utm_campaign") || q.get("utm_source") || "").slice(0, 40);
  if (ct) {
    IOS_URL += (IOS_URL.indexOf("?") === -1 ? "?" : "&") + "ct=" + encodeURIComponent(ct) + "&mt=8";
  }
  if (isAndroid) {
    leave(PLAY, "play");
  } else if (isIOS) {
    if (IOS_URL) { leave(IOS_URL, "appstore"); }
    else { hide("android"); show("ios"); }
  } else {
    // Laptops can't install either app, and the homepage has a puzzle with a message under it
    // plus both badges, so that's where they go. The query string comes too, for analytics.
    // This is also the last moment the real referrer exists. The forward makes phuzzles.app the
    // homepage's referrer, GA4 drops the self-referral, and an UNTAGGED desktop click -- a pasted
    // link, a chat, a search result -- was filed as (direct)/(none). A tagged link was never
    // affected: utm beats referrer. So hand it on for one hop exactly as /solve/, /puzzle/ and
    // /today/ do; index.html reads it once and clears it. Only this branch needs it -- the store
    // branches leave our origin, where no reader of ours could ever run.
    try { var fwdRef = document.referrer;
          if (fwdRef && new URL(fwdRef).origin !== location.origin) sessionStorage.setItem("phz_ref", fwdRef); }
    catch (e) {}
    leave("/" + location.search, "site");
  }
</script>
